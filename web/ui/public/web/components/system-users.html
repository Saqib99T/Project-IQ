<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">System Users</h2>
      <p class="text-gray-500 mt-1">Manage operators and admins who access Project IQ</p>
    </div>
    <button onclick="suOpenCreate()" class="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-700 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Add User
    </button>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex flex-wrap items-center gap-3">
    <input id="su-search" type="text" placeholder="Search by name or email…" oninput="suFilter()"
      class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-56">
    <select id="su-role-filter" onchange="suFilter()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="">All Roles</option>
      <option value="admin">Admin</option>
      <option value="operator">Operator</option>
    </select>
    <select id="su-status-filter" onchange="suFilter()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="">Active Only</option>
      <option value="all">Show Inactive</option>
    </select>
    <button onclick="suLoad()" class="ml-auto flex items-center gap-1.5 px-3 py-1.5 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Refresh
    </button>
    <span id="su-count" class="text-sm text-gray-400"></span>
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100 text-xs font-semibold text-gray-500 uppercase tracking-wide">
          <tr>
            <th class="px-6 py-3 text-left">User</th>
            <th class="px-6 py-3 text-left">Role</th>
            <th class="px-6 py-3 text-left">Team</th>
            <th class="px-6 py-3 text-left">Apps</th>
            <th class="px-6 py-3 text-left">Auth</th>
            <th class="px-6 py-3 text-left">Status</th>
            <th class="px-6 py-3 text-left">Last Seen</th>
            <th class="px-6 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody id="su-tbody" class="divide-y divide-gray-50 text-gray-700">
          <tr><td colspan="8" class="py-12 text-center text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ── CREATE / EDIT MODAL ─────────────────────────────────────────────────── -->
<div id="su-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] flex flex-col">
    <!-- Header -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h3 id="su-modal-title" class="text-lg font-bold text-gray-800">Add System User</h3>
      <button onclick="suCloseModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto px-6 py-5 space-y-4">
      <input type="hidden" id="su-edit-id">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Display Name <span class="text-red-500">*</span></label>
          <input id="su-f-name" type="text" placeholder="Alice Smith"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Username <span class="text-red-500">*</span></label>
          <input id="su-f-username" type="text" placeholder="alice.smith"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">Email <span class="text-gray-400 font-normal">(used to match IAM login)</span></label>
        <input id="su-f-email" type="email" placeholder="alice@company.com"
          class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Role <span class="text-red-500">*</span></label>
          <select id="su-f-role" class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="operator">Operator</option>
            <option value="admin">Admin</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Team</label>
          <input id="su-f-team" type="text" placeholder="Support"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600 mb-1">App Access</label>
        <div id="su-f-apps" class="flex flex-wrap gap-2 p-3 border border-gray-200 rounded-lg min-h-[40px]">
          <!-- checkboxes injected by JS -->
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Max Concurrent Sessions</label>
          <input id="su-f-max" type="number" min="1" max="20" value="3"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div id="su-f-password-wrap">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password <span id="su-pw-hint" class="text-gray-400 font-normal">(leave blank for IAM-only)</span></label>
          <input id="su-f-password" type="password" placeholder="Min 8 characters"
            class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <div id="su-f-active-wrap" class="hidden">
        <label class="flex items-center gap-2 cursor-pointer">
          <input id="su-f-active" type="checkbox" checked class="w-4 h-4 rounded text-blue-600">
          <span class="text-sm text-gray-700">Active (uncheck to deactivate)</span>
        </label>
      </div>

      <div id="su-modal-error" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
      <button onclick="suCloseModal()" class="px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50 transition-colors">Cancel</button>
      <button id="su-save-btn" onclick="suSave()" class="px-5 py-2 text-sm font-semibold bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        Save
      </button>
    </div>
  </div>
</div>

<!-- ── VIEW MODAL ──────────────────────────────────────────────────────────── -->
<div id="su-view-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md">
    <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
      <h3 class="text-lg font-bold text-gray-800">User Details</h3>
      <button onclick="suCloseView()" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="su-view-body" class="px-6 py-5 space-y-3 text-sm text-gray-700"></div>
    <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-2">
      <button id="su-view-edit-btn" onclick="suEditFromView()" class="px-4 py-2 text-sm font-medium bg-blue-600 text-white rounded-lg hover:bg-blue-700">Edit</button>
      <button onclick="suCloseView()" class="px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">Close</button>
    </div>
  </div>
</div>

<!-- ── DELETE CONFIRM ──────────────────────────────────────────────────────── -->
<div id="su-del-modal" class="fixed inset-0 bg-black bg-opacity-40 z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
    <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center mx-auto mb-4">
      <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
    </div>
    <h3 class="text-lg font-bold text-gray-800 mb-1">Deactivate User?</h3>
    <p id="su-del-name" class="text-gray-500 text-sm mb-6"></p>
    <div class="flex gap-3 justify-center">
      <button onclick="suCloseDelete()" class="px-4 py-2 text-sm text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">Cancel</button>
      <button onclick="suConfirmDelete()" class="px-4 py-2 text-sm font-semibold bg-red-600 text-white rounded-lg hover:bg-red-700">Deactivate</button>
    </div>
  </div>
</div>
