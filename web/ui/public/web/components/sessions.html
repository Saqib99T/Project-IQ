<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Active Sessions</h2>
      <p class="text-gray-500 mt-1">Live chatbot and handoff conversations</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="sess-last-refresh" class="text-xs text-gray-400"></span>
      <button onclick="sessRefresh()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>
      <label class="flex items-center gap-2 text-sm text-gray-600">
        <input type="checkbox" id="sess-auto-refresh" onchange="sessToggleAutoRefresh()" class="rounded"> Auto
      </label>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 text-lg">🤖</div>
      <div><p class="text-xs text-gray-500">Bot Active</p><p id="sess-stat-bot" class="text-2xl font-bold text-gray-800">0</p></div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-amber-100 flex items-center justify-center text-amber-600 text-lg">⏳</div>
      <div><p class="text-xs text-gray-500">In Queue</p><p id="sess-stat-queued" class="text-2xl font-bold text-gray-800">0</p></div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600 text-lg">👤</div>
      <div><p class="text-xs text-gray-500">With Operator</p><p id="sess-stat-assigned" class="text-2xl font-bold text-gray-800">0</p></div>
    </div>
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-600 text-lg">💬</div>
      <div><p class="text-xs text-gray-500">Total Active</p><p id="sess-stat-total" class="text-2xl font-bold text-gray-800">0</p></div>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4 flex flex-wrap items-center gap-3">
    <select id="sess-filter-type" onchange="sessLoad()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="">All Types</option>
      <option value="chatbot">🤖 Chatbot</option>
      <option value="handoff">👤 Handoff</option>
    </select>
    <select id="sess-filter-app" onchange="sessLoad()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="">All Apps</option>
    </select>
    <select id="sess-filter-op" onchange="sessLoad()" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      <option value="">All Operators</option>
    </select>
    <span id="sess-count" class="ml-auto text-sm text-gray-500"></span>
  </div>

  <!-- Grid -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
            <th class="px-4 py-3">User</th>
            <th class="px-4 py-3">App</th>
            <th class="px-4 py-3">Type</th>
            <th class="px-4 py-3">Operator</th>
            <th class="px-4 py-3">Started</th>
            <th class="px-4 py-3">Duration</th>
            <th class="px-4 py-3">Messages</th>
            <th class="px-4 py-3">Actions</th>
          </tr>
        </thead>
        <tbody id="sess-tbody">
          <tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Chat View Modal -->
<div id="sess-chat-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col" style="max-height:80vh">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
      <div>
        <h3 id="sess-chat-title" class="font-semibold text-gray-800">Conversation</h3>
        <p id="sess-chat-sub" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button onclick="document.getElementById('sess-chat-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="sess-chat-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  </div>
</div>

<!-- Transfer Modal -->
<div id="sess-transfer-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6">
    <h3 class="font-bold text-gray-800 mb-1">Transfer to Operator</h3>
    <p id="sess-transfer-user" class="text-sm text-gray-500 mb-4"></p>
    <div id="sess-transfer-list" class="space-y-1 max-h-60 overflow-y-auto mb-4"></div>
    <button onclick="document.getElementById('sess-transfer-modal').classList.add('hidden')" class="w-full border border-gray-300 text-gray-600 rounded-lg py-2 text-sm hover:bg-gray-50">Cancel</button>
  </div>
</div>
