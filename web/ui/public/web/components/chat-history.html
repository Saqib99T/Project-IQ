<div class="space-y-6">
  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-2xl font-bold text-gray-800">Chat History</h2>
      <p class="text-gray-500 mt-1">All past conversations and handoff sessions</p>
    </div>
    <div class="flex items-center gap-3">
      <button onclick="chExport()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-gray-600 border border-gray-200 rounded-lg hover:bg-gray-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        Export CSV
      </button>
    </div>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-4">
    <div class="flex flex-wrap items-end gap-3">
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Search</label>
        <input type="text" id="ch-search" placeholder="User, sender ID…" oninput="chDebounce()"
          class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-48">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">App</label>
        <select id="ch-filter-app" onchange="chLoad(1)" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">All Apps</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Status</label>
        <select id="ch-filter-status" onchange="chLoad(1)" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">All</option>
          <option value="chatbot">🤖 Chatbot only</option>
          <option value="resolved">✅ Resolved</option>
          <option value="abandoned">⛔ Abandoned</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">Operator</label>
        <select id="ch-filter-op" onchange="chLoad(1)" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">All Operators</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">From</label>
        <input type="date" id="ch-date-from" onchange="chLoad(1)" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-500 mb-1">To</label>
        <input type="date" id="ch-date-to" onchange="chLoad(1)" class="px-3 py-1.5 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button onclick="chReset()" class="px-3 py-1.5 text-sm text-gray-500 hover:text-gray-700 border border-gray-200 rounded-lg hover:bg-gray-50">Reset</button>
    </div>
  </div>

  <!-- Grid -->
  <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr class="text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
            <th class="px-4 py-3">User</th>
            <th class="px-4 py-3">App</th>
            <th class="px-4 py-3">Status</th>
            <th class="px-4 py-3">Operator</th>
            <th class="px-4 py-3">Started</th>
            <th class="px-4 py-3">Duration</th>
            <th class="px-4 py-3">Messages</th>
            <th class="px-4 py-3">View</th>
          </tr>
        </thead>
        <tbody id="ch-tbody">
          <tr><td colspan="8" class="px-4 py-8 text-center text-gray-400">Loading…</td></tr>
        </tbody>
      </table>
    </div>
    <!-- Pagination -->
    <div class="flex items-center justify-between px-4 py-3 border-t border-gray-100">
      <span id="ch-pagination-info" class="text-xs text-gray-500"></span>
      <div class="flex items-center gap-2">
        <button id="ch-prev" onclick="chPage(-1)" class="px-3 py-1 text-sm border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40">← Prev</button>
        <span id="ch-page-num" class="text-sm text-gray-600 px-2"></span>
        <button id="ch-next" onclick="chPage(1)" class="px-3 py-1 text-sm border border-gray-200 rounded-lg hover:bg-gray-50 disabled:opacity-40">Next →</button>
      </div>
    </div>
  </div>
</div>

<!-- Chat Transcript Modal -->
<div id="ch-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl flex flex-col" style="max-height:85vh">
    <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100 flex-shrink-0">
      <div>
        <h3 id="ch-modal-title" class="font-semibold text-gray-800">Transcript</h3>
        <p id="ch-modal-sub" class="text-xs text-gray-400 mt-0.5"></p>
      </div>
      <button onclick="document.getElementById('ch-modal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="ch-modal-messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
  </div>
</div>
