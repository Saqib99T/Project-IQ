# pgBouncer connection pooler for Project IQ
#
# Install on Ubuntu:
#   sudo apt install pgbouncer
#   sudo cp infra/pgbouncer.ini /etc/pgbouncer/pgbouncer.ini
#   sudo cp infra/pgbouncer_userlist.txt /etc/pgbouncer/userlist.txt
#   sudo systemctl restart pgbouncer
#
# Then change app.config.local:
#   db_host = localhost
#   db_port = 6432        ← pgBouncer port, not 5432
#
# PostgreSQL stays on 5432 and is no longer directly reachable by the app.

[databases]
# Format: <db_alias> = host=<pg_host> port=<pg_port> dbname=<db_name>
# The alias must match db_name in the app config.
Chatbot = host=127.0.0.1 port=5432 dbname=Chatbot

[pgbouncer]
# ── Listener ─────────────────────────────────────────────────────────────────
listen_addr   = 127.0.0.1
listen_port   = 6432

# ── Pool mode ────────────────────────────────────────────────────────────────
# transaction mode: a real PG connection is held only for the duration of a
# transaction, then returned to the pool. Safe for psycopg2 + most ORM usage.
# session mode would be needed for SET LOCAL, advisory locks, etc.
pool_mode = transaction

# ── Pool sizing ──────────────────────────────────────────────────────────────
# max_client_conn: how many app-side connections pgBouncer accepts.
#   Our ThreadedConnectionPool has maxconn=50. Set a comfortable margin.
max_client_conn = 200

# default_pool_size: real PG connections per database+user pair.
#   PostgreSQL handles ~100 concurrent connections comfortably on a small VM.
#   20 real PG connections can serve 200 app connections in transaction mode.
default_pool_size = 20

# min_pool_size: always keep this many idle PG connections open (warm pool).
min_pool_size = 5

# reserve_pool_size: extra connections allowed briefly when pool is full.
reserve_pool_size = 5
reserve_pool_timeout = 3

# ── Timeouts ─────────────────────────────────────────────────────────────────
# Kill an idle client connection after 10 minutes.
client_idle_timeout = 600

# Kill a server connection idle for 30 minutes (prevents stale PG connections).
server_idle_timeout = 1800

# If a server connection takes > 15s to become available, raise an error.
query_wait_timeout = 15

# ── Auth ─────────────────────────────────────────────────────────────────────
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# ── Logging ──────────────────────────────────────────────────────────────────
logfile  = /var/log/pgbouncer/pgbouncer.log
pidfile  = /var/run/pgbouncer/pgbouncer.pid
log_connections    = 0
log_disconnections = 0
log_pooler_errors  = 1

# ── Admin interface ───────────────────────────────────────────────────────────
# Connect with: psql -h 127.0.0.1 -p 6432 -U pgbouncer pgbouncer
admin_users   = pgbouncer
stats_users   = pgbouncer
