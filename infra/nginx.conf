# Project IQ — Nginx reverse proxy
#
# Responsibilities:
#   - Serve static assets directly (no Python involved)
#   - Gzip compression
#   - Rate limiting
#   - Proxy all public traffic to Flask Admin API (port 8181)
#   - Internal Rasa load balancer (port 5000, localhost only)
#     Routes to up to 3 Rasa instances on ports 5005/5006/5007
#
# Install on Ubuntu:
#   sudo apt install nginx
#   sudo cp infra/nginx.conf /etc/nginx/sites-available/project-iq
#   sudo ln -s /etc/nginx/sites-available/project-iq /etc/nginx/sites-enabled/
#   sudo cp infra/proxy_params.conf /etc/nginx/snippets/proxy_params.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Adjust STATIC_ROOT to match your actual dist-widget path on the server.

# ── Rate limiting zones ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m    rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m  rate=5r/s;

# ── Public upstream — Flask Admin API ────────────────────────────────────────
# Add more servers here when running multiple Gunicorn instances:
#   server 127.0.0.1:8182;
#   server 127.0.0.1:8183;
upstream flask_admin {
    server 127.0.0.1:8181;
    keepalive 32;
}

# ── Internal upstream — Rasa Core instances ──────────────────────────────────
# Round-robin load balancing across Rasa instances.
# All instances share the same PostgreSQL tracker store so conversation state
# is consistent regardless of which instance handles a request.
#
# Single instance (default):
upstream rasa_core {
    server 127.0.0.1:5005;
    keepalive 16;
}
# Two instances — uncomment when running a second Rasa process on port 5006:
# upstream rasa_core {
#     server 127.0.0.1:5005;
#     server 127.0.0.1:5006;
#     keepalive 16;
# }
# Three instances — uncomment when running a third on port 5007:
# upstream rasa_core {
#     server 127.0.0.1:5005;
#     server 127.0.0.1:5006;
#     server 127.0.0.1:5007;
#     keepalive 16;
# }

# ── Public HTTP server (port 80) ─────────────────────────────────────────────
server {
    listen 80;
    server_name _;   # replace with your domain or IP

    set $STATIC_ROOT /home/user/project-iq/admin/ui/dist-widget;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Static assets — never touch Flask ───────────────────────────────────
    location ~* ^/(js|assets)/.*\.(js|css|woff2?|ttf|svg|png|webp|ico)$ {
        root $STATIC_ROOT;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /glpi-chat-widget.js {
        root $STATIC_ROOT;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.css$ {
        root $STATIC_ROOT;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # ── Login endpoints — strict rate limiting ───────────────────────────────
    location ~ ^/(admin/login|operator/login)$ {
        limit_req zone=login_limit burst=10 nodelay;
        proxy_pass http://flask_admin;
        include /etc/nginx/snippets/proxy_params.conf;
    }

    # ── Socket.IO — WebSocket upgrade ───────────────────────────────────────
    location /socket.io/ {
        proxy_pass http://flask_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_buffering off;
    }

    # ── All other requests → Flask ───────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://flask_admin;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}

# ── Internal Rasa load balancer (port 5000, localhost only) ──────────────────
# The Flask Admin API points RASA_URL at http://127.0.0.1:5000.
# Nginx distributes those calls across all running Rasa instances.
# This port is bound to 127.0.0.1 only — never reachable from outside.
server {
    listen 127.0.0.1:5000;
    server_name localhost;

    # No rate limiting — this is internal traffic only

    # Long timeout for Rasa NLU inference (can take a few seconds under load)
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location / {
        proxy_pass http://rasa_core;
        include /etc/nginx/snippets/proxy_params.conf;
    }
}

