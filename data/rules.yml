# rules.yml

version: "3.1"

rules:
  - rule: Activate Login Form
    steps:
      - intent: login
      - action: login_form
      - active_loop: login_form

  - rule: Submit Login Form
    condition:
      - active_loop: login_form
    steps:
      - action: login_form
      - active_loop: null
      - slot_was_set:
        - requested_slot: null
      - action: action_glpi_login

  - rule: Say hi
    steps:
      - intent: greet
      - action: action_greet
      
  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Respond to out-of-scope queries
    steps:
      - intent: out_of_scope
      - action: utter_out_of_scope
      - action: utter_ask_continue

  - rule: Ask the user to rephrase whenever they send a message with low NLU confidence
    steps:
      - intent: nlu_fallback
      - action: utter_please_rephrase

  # --- FORM RULES (Ticket Creation) ---
  
  # --- FORM RULES (Ticket Creation) ---
  
  # Step 1: Always search KB before creating a ticket
  - rule: Create Ticket -> Search KB -> Found/Not Found Logic handled by action
    steps:
      - intent: create_ticket
      - action: action_search_kb_before_ticket

  # Step 2: If KB search is skipped/not found (returns FollowupAction match)
  - rule: Auto-Start Ticket Form (KB Skipped/Missing)
    steps:
      - intent: create_ticket
      - action: action_search_kb_before_ticket
      - action: action_init_glpi_session
      - action: utter_ticket_form

  # Step 3: If KB is not helpful (Explicit user choice), start the form
  - rule: KB Not Helpful -> Start Ticket Form
    steps:
      - intent: kb_not_helpful
      - action: action_init_glpi_session
      - action: utter_ticket_form

  - rule: Handle Ticket Form Submission
    steps:
      - intent: submit_ticket_form
      - action: action_create_ticket_from_form

  - rule: Create Ticket on Affirmation
    steps:
      - action: utter_ask_confirm_ticket
      - intent: affirm
      - action: action_create_glpi_ticket

  - rule: Submit ticket_form - Ask Confirmation
    condition:
      - active_loop: ticket_form
    steps:
      - action: ticket_form
      - active_loop: null
      - slot_was_set:
        - requested_slot: null
      - action: utter_ask_confirm_ticket

  - rule: Handle satisfaction rating
    steps:
      - or:
        - intent: rating_1
        - intent: rating_2
        - intent: rating_3
        - intent: rating_4
        - intent: rating_5
      - action: action_save_satisfaction_rating

  - rule: Show full KB answer
    steps:
      - intent: kb_show_full_answer
      - action: action_show_kb_full_answer

  - rule: Show ticket status graph
    steps:
      - intent: show_ticket_graph
      - action: action_show_ticket_graph

  - rule: Interrupt form with stop intent
    condition:
      - active_loop: ticket_form
    steps:
      - intent: stop
      - action: utter_stop_form
      - action: action_deactivate_form
      - active_loop: null
      
      - action: utter_ask_anything_else

  # --- STATUS CHECK RULES (Mutually Exclusive) ---
  # Rules disabled to favour Stories and avoid conflicts
  # RULE 1: Init session, then run status check if ID is present immediately
  - rule: Init GLPI session and Check Status when ID is present
    steps:
      - intent: check_status
      - slot_was_set:
          - ticket_id: true # Condition via simple existence check if possible or rely on entity
      - action: action_init_glpi_session
      - action: action_check_glpi_status
      - action: utter_ask_anything_else

  # RULE 2: Init session, then ask for ID if status is requested but ID is MISSING
  - rule: Init GLPI session and Ask for Ticket ID when checking status
    condition:
      - slot_was_set:
          - ticket_id: null # Condition: Ticket ID slot is empty
    steps:
      - intent: check_status
      - action: action_init_glpi_session
      - action: utter_ask_ticket_id
      - action: action_listen

  # RULE 3: Init session, then continue check status after providing ID via 'inform'
  - rule: Continue Check Status after providing ID
    condition:
      - slot_was_set:
          - ticket_id: true
    steps:
      - action: utter_ask_ticket_id # Was previously executed
      - intent: inform
      - action: action_check_glpi_status
      - action: utter_ask_anything_else

  - rule: Handle File Upload
    steps:
      - intent: upload_file
      - action: action_init_glpi_session
      - action: action_upload_file
      - action: utter_ask_anything_else

  # RULE: Clear Session
  - rule: Clear Session
    steps:
      - intent: clear
      - action: action_clear_session
      - action: utter_cleared

  - rule: List Tickets
    steps:
      - intent: list_tickets
      - action: action_list_open_tickets

  - rule: Update Ticket - Ask for new status
    steps:
      - intent: update_ticket
      - action: action_init_glpi_session
      - action: utter_ask_ticket_id

  - rule: Update Ticket - After providing ticket ID
    condition:
      - slot_was_set:
          - ticket_id: true
    steps:
      - intent: update_ticket
      - action: action_init_glpi_session
      - action: action_check_glpi_status
      - action: utter_ask_target_status

  - rule: Handle Status Update from Button
    condition:
      - slot_was_set:
          - ticket_id: true
    wait_for_user_input: false
    steps:
      - action: utter_ask_target_status
      - intent: inform_update
      - action: action_update_glpi_ticket
      - action: utter_ask_anything_else

  - rule: Show Chart
    steps:
      - intent: show_chart
      - action: action_show_chart

  - rule: Search Knowledge Base
    steps:
      - intent: ask_knowledge
      - action: action_search_knowledge_base

  - rule: Save Positive Feedback
    steps:
      - intent: feedback_positive
      - action: action_save_feedback

  - rule: Save Negative Feedback
    steps:
      - intent: feedback_negative
      - action: action_save_feedback

  - rule: Handle Multi Action Request
    steps:
      - intent: multi_action
      - action: action_init_glpi_session
      - action: action_handle_multi_intent

  # NEW RULE: Handle Verify Resolution / Close Ticket
  - rule: Verify Resolution / Close Ticket
    steps:
      - intent: verify_resolution
      - action: action_init_glpi_session
      - action: action_verify_glpi_resolution

  - rule: Confirm Resolution Update
    steps:
      - action: action_verify_glpi_resolution
      - intent: inform_update
      - action: action_update_glpi_ticket
      - action: utter_ask_anything_else

  - rule: List Attachments
    steps:
      - intent: list_attachments
      - action: action_init_glpi_session
      - action: action_list_attachments
      - action: utter_ask_anything_else
