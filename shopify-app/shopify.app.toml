# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "24225b50d11f7f5fee330cfd4ea8a693"
name = "MyApp"
application_url = "http://localhost:8181/admin/shopify"
embedded = false

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_customers,write_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
# The trycloudflare.com URL is a temporary quick-tunnel (SSH port-forward to
# prod's 8181 + cloudflared) used to test webhook delivery against the real
# prod deployment before a permanent domain/TLS setup exists — EPHEMERAL,
# changes every time the tunnel is restarted. Replace with a real prod
# domain once one exists; keep localhost for local dev testing either way.
redirect_urls = [
  "http://localhost:8181/admin/shopify/callback",
  "https://adopted-suspension-engineering-nitrogen.trycloudflare.com/admin/shopify/callback",
]

[webhooks]
api_version = "2026-07"

# Order events — declarative subscriptions (Shopify's recommended mechanism)
# instead of the runtime REST registration bp_shopify.py used to do at OAuth-
# connect time, which broke once expiring tokens became mandatory. Shopify
# applies these automatically to every shop that installs the app — no
# per-connection registration code needed. `uri` must be a real public HTTPS
# endpoint reachable from Shopify's servers; localhost doesn't work here
# (unlike the OAuth redirect, this is a server-to-server delivery, not
# browser-mediated) — deploy only once a public URL exists for this app.
[[webhooks.subscriptions]]
topics = ["orders/create", "orders/updated", "orders/cancelled"]
uri = "https://adopted-suspension-engineering-nitrogen.trycloudflare.com/webhooks/shopify"

# The three privacy/GDPR compliance topics mandatory for any multi-merchant
# app — bp_shopify.py's /webhooks/shopify handler already handles all three
# (see shopify_webhook() in web/api/blueprints/bp_shopify.py).
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://adopted-suspension-engineering-nitrogen.trycloudflare.com/webhooks/shopify"
