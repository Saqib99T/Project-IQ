name: security

# Dependency vulnerability cadence. Runs weekly, on demand, and whenever
# requirements.txt changes. Advisory (continue-on-error) for now: the rasa 3.6
# stack pins many transitive deps, so findings are surfaced for triage rather
# than hard-failing the build until the backlog is worked down.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements.txt"
      - "web/ui/package-lock.json"
      - "expo-app/package-lock.json"
      - "scripts/demo-automation/package-lock.json"
      - ".github/workflows/security.yml"

jobs:
  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit requirements.txt
        run: pip-audit -r requirements.txt --desc --progress-spinner=off

  npm-audit:
    name: npm audit (advisory) — ${{ matrix.dir }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        dir: [web/ui, expo-app, scripts/demo-automation]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high
