name: secret-scan

# Scans every push and PR for committed credentials (API keys, tokens,
# passwords). Runs full-history on push to a branch, diff-only on PRs so a
# large existing history doesn't fail unrelated PRs — see docs/ARCHITECTURE_REVIEW.md
# CRIT-02 (this workflow exists specifically because CRIT-01, a live JWT
# committed to common/tmp/admin_token.txt, went undetected for two months).

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
