name: tests

# Runs the core-platform automated test suites (Web API, Action Server,
# Common/IAM, NLU data — 120 tests) on every push and pull request.
# The standalone itsm-service runs its own 175-test suite via its own
# .github/workflows/ci.yml in that repository.

on:
  push:
  pull_request:

jobs:
  core-platform:
    name: Core-platform suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # rasa 3.6 / rasa-sdk pin to <=3.10
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyyaml

      - name: Run test suites (Web API · Action Server · Common/IAM · NLU)
        run: python -m pytest tests/ --tb=short

      - name: Validate Rasa training data (schema, undefined intents/actions, missing responses)
        working-directory: core
        run: python -m rasa data validate --config config.yml --domain domain.yml --data data

  lint-no-print:
    name: Lint — no new print() in runtime code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Block new print() in production code (ruff T20; see ruff.toml)
        run: ruff check .
