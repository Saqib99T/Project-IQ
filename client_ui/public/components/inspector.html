<div class="mb-8 flex items-center justify-between">
    <div>
        <h2 class="text-2xl font-bold text-gray-800">🔍 Conversation Inspector</h2>
        <p class="text-gray-500 mt-1">Debug AI assistant behavior and conversation flows</p>
    </div>
    <button onclick="refreshInspector()" class="btn-secondary flex items-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        Refresh
    </button>
</div>

<!-- Inspector Tabs -->
<div class="flex gap-2 mb-6">
    <button onclick="showInspectorTab('conversations')"
        class="inspector-tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-purple-600 text-white"
        data-tab="conversations">
        💬 Conversations
    </button>
    <button onclick="showInspectorTab('flows')"
        class="inspector-tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700" data-tab="flows">
        🔀 Flows
    </button>
    <button onclick="showInspectorTab('intents')"
        class="inspector-tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700" data-tab="intents">
        🎯 Intents
    </button>
    <button onclick="showInspectorTab('actions')"
        class="inspector-tab-btn px-4 py-2 rounded-lg text-sm font-medium bg-gray-200 text-gray-700" data-tab="actions">
        ⚡ Actions
    </button>
</div>

<!-- Conversations Tab -->
<div id="inspector-tab-conversations" class="inspector-tab-content">
    <!-- Filter Bar -->
    <div class="card p-4 mb-4">
        <div class="flex flex-wrap gap-3 items-end">
            <!-- User Search -->
            <div class="flex-1 min-w-[150px]">
                <label class="block text-xs text-gray-500 mb-1">User</label>
                <input type="text" id="filter-user" placeholder="Search by user..."
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none"
                    oninput="applyInspectorFilters()">
            </div>

            <!-- App Filter -->
            <div class="min-w-[140px]">
                <label class="block text-xs text-gray-500 mb-1">App</label>
                <select id="filter-app" onchange="applyInspectorFilters()"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none bg-white">
                    <option value="">All Apps</option>
                    <option value="IT">IT</option>
                    <option value="Accounting">Accounting</option>
                    <option value="General">General</option>
                </select>
            </div>

            <!-- Ticket Status Filter -->
            <div class="min-w-[150px]">
                <label class="block text-xs text-gray-500 mb-1">Ticket Status</label>
                <select id="filter-ticket-status" onchange="applyInspectorFilters()"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none bg-white">
                    <option value="">All Status</option>
                    <option value="created">Created</option>
                    <option value="resolved">Resolved</option>
                    <option value="closed">Closed</option>
                    <option value="none">No Ticket</option>
                </select>
            </div>

            <!-- Date Range Filter -->
            <div class="min-w-[160px]">
                <label class="block text-xs text-gray-500 mb-1">Date Range</label>
                <select id="filter-date" onchange="applyInspectorFilters()"
                    class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none bg-white">
                    <option value="">All Time</option>
                    <option value="24h">Last 24 Hours</option>
                    <option value="7d">Last 7 Days</option>
                    <option value="30d">Last 30 Days</option>
                    <option value="custom">Custom Range</option>
                </select>
            </div>

            <!-- Custom Date Range (hidden by default) -->
            <div id="custom-date-range" class="hidden min-w-[250px]">
                <label class="block text-xs text-gray-500 mb-1">Custom Range</label>
                <div class="flex gap-2">
                    <input type="date" id="filter-date-from" onchange="applyInspectorFilters()"
                        class="flex-1 px-2 py-2 text-sm border border-gray-200 rounded-lg">
                    <input type="date" id="filter-date-to" onchange="applyInspectorFilters()"
                        class="flex-1 px-2 py-2 text-sm border border-gray-200 rounded-lg">
                </div>
            </div>

            <!-- Reset Button -->
            <button onclick="resetInspectorFilters()"
                class="px-4 py-2 text-sm text-gray-600 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                Reset
            </button>
        </div>

        <!-- Active Filters Display -->
        <div id="active-filters" class="mt-3 hidden">
            <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs text-gray-500">Active filters:</span>
                <div id="active-filter-tags" class="flex flex-wrap gap-1"></div>
            </div>
        </div>
    </div>

    <div class="grid grid-cols-3 gap-6">
        <div class="card p-4 max-h-[55vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-semibold">Conversations</h3>
                <span id="conv-count" class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded">0</span>
            </div>
            <div id="inspector-conv-list" class="space-y-2 text-sm"></div>
        </div>
        <div class="col-span-2 card p-4 max-h-[60vh] overflow-y-auto">
            <div id="inspector-no-selection" class="text-center py-12 text-gray-400">
                <span class="text-4xl">👈</span>
                <p class="mt-2">Select a conversation to view details</p>
            </div>
            <div id="inspector-conv-detail" class="hidden">
                <div class="flex gap-3 mb-4">
                    <span class="px-3 py-1 bg-purple-100 text-purple-700 rounded text-sm"><b id="insp-msg-count">0</b>
                        messages</span>
                    <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded text-sm"><b id="insp-action-count">0</b>
                        actions</span>
                    <span class="px-3 py-1 bg-green-100 text-green-700 rounded text-sm"><b id="insp-intent-count">0</b>
                        intents</span>
                </div>
                <div id="inspector-messages" class="space-y-2"></div>
            </div>
        </div>
    </div>
</div>

<!-- Flows Tab -->
<div id="inspector-tab-flows" class="inspector-tab-content hidden">
    <div id="inspector-flows-grid" class="grid grid-cols-3 gap-4"></div>
</div>

<!-- Intents Tab -->
<div id="inspector-tab-intents" class="inspector-tab-content hidden">
    <div class="flex gap-4 mb-6">
        <div class="card p-6 text-center">
            <div id="insp-total-intents" class="text-3xl font-bold text-purple-600">0</div>
            <div class="text-sm text-gray-500">Total Messages</div>
        </div>
        <div class="card p-6 text-center">
            <div id="insp-unique-intents" class="text-3xl font-bold text-blue-600">0</div>
            <div class="text-sm text-gray-500">Unique Intents</div>
        </div>
    </div>
    <div id="inspector-intent-chart" class="card p-4"></div>
</div>

<!-- Actions Tab -->
<div id="inspector-tab-actions" class="inspector-tab-content hidden">
    <div class="card overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-gray-100 text-gray-600">
                <tr>
                    <th class="px-4 py-3 text-left">Action</th>
                    <th class="px-4 py-3 text-left">Total</th>
                    <th class="px-4 py-3 text-left">Success</th>
                    <th class="px-4 py-3 text-left">Failure</th>
                    <th class="px-4 py-3 text-left">Success Rate</th>
                </tr>
            </thead>
            <tbody id="inspector-actions-table"></tbody>
        </table>
    </div>
</div>
