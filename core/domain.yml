version: "3.1"

intents:
  - hi
  - greet
  - goodbye
  - login
  - create_ticket
  - update_ticket
  - verify_resolution
  - submit_ticket_form
  - check_status
  - inform
  - inform_update
  - deny
  - affirm
  - stop
  - out_of_scope
  - list_tickets
  - view_comments
  - help
  - upload_file 
  - list_attachments
  - clear
  - show_chart
  - ask_knowledge
  - feedback_positive
  - feedback_negative
  - multi_action
  - kb_not_helpful
  - kb_show_full_answer
  - kb_show_full_article
  - rating_1
  - rating_2
  - rating_3
  - rating_4
  - rating_5
  - show_ticket_graph
  # ── Handoff intents ──────────────────────────────────────────────────
  - request_human_agent
  - confirm_handoff
  - cancel_handoff
  - confirm_gdpr_consent
  - deny_gdpr_consent
  - accept_ticket_fallback
  # Retrieval intents (ResponseSelector) — smalltalk + service FAQ
  - chitchat
  - faq

entities:
  - ticket_id
  - app_id
  - description
  - issue_type
  - urgency
  - update_content
  - target_status
  - file_name
  - file_data
  - chart_type
  - itsm_username
  - itsm_password

slots:
  ticket_id:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: ticket_id
      - type: from_entity
        entity: ticket_id
  
  app_id:
    type: text
    influence_conversation: true
    mappings: # Can be set by custom actions or metadata
      - type: from_entity
        entity: app_id
        
  ticket_title: 
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: description 
      - type: from_text
        conditions:
         - active_loop: ticket_form
           requested_slot: ticket_title 
        
  ticket_content:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  ticket_detail:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  priority:
    type: text
    influence_conversation: false
    mappings:
      - type: custom
  category:
    type: text
    influence_conversation: false
    mappings:
      - type: custom 
           
  update_content:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: update_content
      - type: from_text
        intent: inform_update

  file_name:
    type: text
    influence_conversation: false
    mappings: 
      - type: from_entity
        entity: file_name

  file_data:
    type: text
    influence_conversation: false
    mappings: 
      - type: from_entity
        entity: file_data

  target_status:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: target_status
  
  issue_type:
    type: categorical
    values:
      - Hardware
      - Software
      - Network
      - Other
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: issue_type
        intent: create_ticket
      - type: from_entity
        entity: issue_type
        
  urgency:
    type: categorical
    values:
      - Low
      - Medium
      - High
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: urgency
        intent: create_ticket
      - type: from_entity
        entity: urgency
        
  ticket_status:
    type: text
    influence_conversation: false
    mappings: []
    
  session_token:
    type: text
    influence_conversation: false
    mappings: []

  svc_session_token:
    type: text
    influence_conversation: false
    mappings: []

  # Detected user language (en|de|fr|es|ar) — set by custom actions from the
  # user's message text; persists so short follow-ups keep the same language.
  user_lang:
    type: text
    influence_conversation: false
    mappings: []

  # IAM identity slots — set from message metadata on each request
  iam_sub:
    type: text
    influence_conversation: false
    mappings:
      - type: from_text
        intent: session_start

  iam_name:
    type: text
    influence_conversation: false
    mappings: []

  iam_email:
    type: text
    influence_conversation: false
    mappings: []

  iam_org_id:
    type: text
    influence_conversation: false
    mappings: []

  iam_org_name:
    type: text
    influence_conversation: false
    mappings: []

  support_org_id:
    type: text
    influence_conversation: false
    mappings: []

  channel:
    type: text
    influence_conversation: false
    mappings: []

  product_id:
    type: text
    influence_conversation: false
    mappings: []

  itsm_user_id:
    type: float
    influence_conversation: false
    mappings: []

  itsm_username:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: itsm_username
      - type: from_text
        conditions:
         - active_loop: login_form
           requested_slot: itsm_username

  itsm_password:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: itsm_password
      - type: from_text
        conditions:
         - active_loop: login_form
           requested_slot: itsm_password



  is_authenticated:
    type: bool
    influence_conversation: false
    mappings: []

  itsm_user_name:
    type: text
    influence_conversation: false
    mappings: []

  chart_type:
    type: text
    influence_conversation: false
    mappings:
      - type: from_entity
        entity: chart_type

  requested_slot:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_question:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_answer:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_article_title:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_article_content:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_source:
    type: text
    influence_conversation: false
    mappings: []

  kb_last_itsm_id:
    type: text
    influence_conversation: false
    mappings: []

  kb_target_article_id:
    type: text
    influence_conversation: false
    mappings: []

  kb_clarify_options:
    type: text
    influence_conversation: false
    mappings: []

  kb_clarify_attempts:
    type: float
    influence_conversation: false
    mappings: []

  kb_articles_shown:
    type: bool
    influence_conversation: false
    mappings: []

  # ── Handoff slots ────────────────────────────────────────────────────
  handoff_state:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  queue_id:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  queue_position:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  wait_estimate_mins:
    type: float
    influence_conversation: false
    mappings:
      - type: custom

  assigned_operator_name:
    type: text
    influence_conversation: false
    mappings:
      - type: custom

  low_conf_streak:
    type: float
    initial_value: 0
    influence_conversation: false
    mappings:
      - type: custom

  frustration_score:
    type: float
    initial_value: 0.0
    influence_conversation: false
    mappings:
      - type: custom

  consent_given:
    type: bool
    influence_conversation: false
    mappings:
      - type: custom

responses:
  # ── Smalltalk (chitchat retrieval responses) ────────────────────────────
  utter_chitchat/how_are_you:
    - text: "I'm doing great and ready to help! 🙂 What can I do for you?"
  utter_chitchat/who_are_you:
    - text: "I'm the Project IQ assistant — I help with IT support: answering questions, creating and tracking tickets, and connecting you to a human agent when needed."
  utter_chitchat/are_you_a_bot:
    - text: "I'm an AI assistant 🤖. I can handle most IT support requests, and I'll connect you to a human agent whenever you need one."
  utter_chitchat/what_can_you_do:
    - text: "I can help you:\n• 🔍 Find answers in the knowledge base\n• 🎫 Create and track support tickets\n• 🔄 Update or close your tickets\n• 🧑‍💼 Connect you with a human agent\n\nWhat would you like to do?"
  utter_chitchat/thanks:
    - text: "You're welcome! 😊 Is there anything else I can help with?"
  utter_chitchat/joke:
    - text: "Why did the IT ticket go to therapy? It had too many unresolved issues. 😄 Now — how can I actually help?"
  utter_chitchat/who_made_you:
    - text: "I was built by the Project IQ team at 99 Technologies to help with IT support."

  # ── Service FAQ (faq retrieval responses) ───────────────────────────────
  utter_faq/what_is_this:
    - text: "This is Project IQ — an AI-powered IT support assistant. Ask a question, raise a ticket, or get connected to an agent."
  utter_faq/support_hours:
    - text: "I'm available 24/7 for self-service help. Human agents are available during your organisation's support hours — I'll let you know wait times when you ask for one."
  utter_faq/languages:
    - text: "You can ask in several languages — I'll understand and search the knowledge base across languages, and reply in yours where supported."
  utter_faq/data_privacy:
    - text: "Your conversation is handled securely and used only to assist you. Sensitive details are masked, and you can request a human agent at any time."

  utter_greet:
    - text: "👋 **Hello! Welcome to Project IQ Bot!**

I'm here to help you with your IT needs. Please login to manage tickets, or search the Knowledge Base as a guest."
      buttons:
        - title: "🔑 Login"
          payload: "/login"
        - title: "📚 Search Knowledge Base"
          payload: "/ask_knowledge"
  utter_goodbye:
    - text: "Goodbye! Let me know if you need anything else."
  utter_ask_ticket_id:
    - text: "Please provide the **ID of the ticket** you want to check (e.g., Ticket-1234 or just 1234)."
  utter_ticket_status_info:
    - text: "The status for ticket **{ticket_id}** is **{ticket_status}**."
  utter_ticket_id_not_found:
    - text: "I couldn't find a ticket with the ID **{ticket_id}**. Please double-check the number."
  utter_stop_form:
    - text: "Okay, I've stopped the ticket creation process. What would you like to do instead?"
  utter_ask_anything_else:
    - text: "Is there anything else I can help you with?"
  
  utter_ask_update_content:
    - text: "What additional information would you like to add to the ticket?"
    
  utter_ticket_updated:
    - text: "I've added that information to your ticket."

  utter_ticket_closed:
    - text: "Great! I've marked the ticket as closed."
  
  utter_ask_target_status:
    - text: "The ticket is currently **{ticket_status}**. What should the new status be? (e.g. Processing, Solved, Pending)"
      buttons:
        - title: "Processing (Planned)"
          payload: '/inform_update{{"target_status":"Processing (Planned)"}}'
        - title: "Pending"
          payload: '/inform_update{{"target_status":"Pending"}}'
        - title: "Solved"
          payload: '/inform_update{{"target_status":"Solved"}}'

  # Form prompts
  utter_ask_itsm_username:
    - text: "Please enter your **username**:"

  utter_ask_itsm_password:
    - text: "Please enter your **password**:"

  utter_ask_confirm_ticket:
    - text: "I have gathered the following details:\n\n**Title:** {ticket_title}\n**Content:** {ticket_content}\n**Issue Type:** {issue_type}\n**Urgency:** {urgency}\n\nDo you want to create this ticket?"
      buttons:
        - title: "Yes, create it"
          payload: "/affirm"
        - title: "No, cancel"
          payload: "/deny"
  utter_ask_ticket_title: 
    - text: "Please provide a **short summary/title** for the problem."
      buttons:
        - title: "Cancel"
          payload: "/stop"
  utter_ask_ticket_content: 
    - text: "Now, please describe the problem **in detail** (the content for the ticket)."
      buttons:
        - title: "Cancel"
          payload: "/stop"
  utter_ask_issue_type:
    - text: "What type of issue is this? (Hardware, Software, Network, or Other)"
      buttons:
        - title: "Hardware"
          payload: '/inform{{"issue_type":"Hardware"}}'
        - title: "Software"
          payload: '/inform{{"issue_type":"Software"}}'
        - title: "Network"
          payload: '/inform{{"issue_type":"Network"}}'
        - title: "Other"
          payload: '/inform{{"issue_type":"Other"}}'
        - title: "Cancel"
          payload: "/stop"
  utter_ask_urgency:
    - text: "What is the urgency level? (Low, Medium, or High)"
      buttons:
        - title: "Low"
          payload: '/inform{{"urgency":"Low"}}'
        - title: "Medium"
          payload: '/inform{{"urgency":"Medium"}}'
        - title: "High"
          payload: '/inform{{"urgency":"High"}}'
        - title: "Cancel"
          payload: "/stop"
    
  utter_ticket_creation_failed:
    - text: "Sorry, I ran into an error and could not create your ticket."
  utter_ask_retry:
    - text: "Would you like to try again?"
  utter_error_occurred:
    - text: "An error occurred while processing your request."
  utter_ask_how_can_help:
    - text: "How can I help you today?"
  utter_help:
    - text: "I can help you create tickets, check status, or update existing tickets.\n\nTo **attach a file**, simply click the 📎 **Paperclip icon** in the chat bar (make sure you have selected a ticket first by creating one or checking its status)."
  utter_ask_continue:
    - text: "Do you want to continue?"
  utter_ask_ticket_id_again:
    - text: "Please provide the ticket ID again."
  utter_ticket_not_found:
    - text: "Ticket not found."
  utter_operation_cancelled:
    - text: "Operation cancelled."
  utter_please_rephrase:
    - text: "I'm sorry, I didn't verify that. Could you rephrase?"
  utter_default:
    - text: "I'm not sure I understand. You can search the Knowledge Base or login to manage tickets."
      buttons:
        - title: "🔑 Login"
          payload: '/login'
        - title: "📚 Search Knowledge Base"
          payload: '/ask_knowledge'
    
  utter_out_of_scope:
    - text: "I'm an IT support assistant and can help you with tickets. I can't help with that request."
    - text: "I'm here to help with IT tickets only. Try asking about creating or viewing tickets!"
    
  utter_cleared:
    - text: "Session cleared. I've forgotten everything by resetting slots. How can I help you now?"

  utter_ask_satisfaction:
    - text: "How satisfied are you with our service?"
      buttons:
        - title: "⭐ Great"
          payload: '/feedback_positive'
        - title: "😞 Not good"
          payload: '/feedback_negative'

  utter_ticket_form:
    - custom:
        ticket_form: true
        text: "Please fill out the ticket details below:"

  utter_thanks_positive_rating:
    - text: "Thank you for the great feedback! 🎉 Is there anything else I can help you with?"

  utter_ask_improvement:
    - text: "I'm sorry to hear that. What could we do better? Your feedback helps us improve."

  # ── Handoff responses ────────────────────────────────────────────────
  utter_gdpr_consent_request:
    - text: "Before I connect you, please note: a human support agent will join this conversation and will be able to view your chat history in order to assist you. Do you agree to share your conversation?"
      buttons:
        - title: "Yes, I agree"
          payload: "/confirm_gdpr_consent"
        - title: "No, keep the AI"
          payload: "/deny_gdpr_consent"

  utter_checking_availability:
    - text: "Let me check agent availability for you..."

  utter_queued_for_operator:
    - text: "You are in the queue (position {queue_position}). Estimated wait: ~{wait_estimate_mins} minutes. I will notify you as soon as an agent joins."

  utter_no_agents_available:
    - text: "No agents are available right now. What would you prefer?"
      buttons:
        - title: "Create a support ticket"
          payload: "/accept_ticket_fallback"
        - title: "Wait in queue anyway"
          payload: "/confirm_handoff"
        - title: "Search knowledge base"
          payload: "/ask_knowledge"

  utter_agents_busy_with_wait:
    - text: "All agents are currently busy. Estimated wait: ~{wait_estimate_mins} minutes. You are #{queue_position} in the queue."
      buttons:
        - title: "Wait in queue"
          payload: "/confirm_handoff"
        - title: "Create a ticket instead"
          payload: "/accept_ticket_fallback"

  utter_agent_joined:
    - text: "{assigned_operator_name} has joined and reviewed your case. Go ahead!"

  utter_handoff_resolved_return:
    - text: "{assigned_operator_name} has closed the session. Is there anything else I can help you with?"

  utter_handoff_cancelled:
    - text: "No problem, I'll keep trying to help you. What would you like to do?"
      buttons:
        - title: "Create a ticket"
          payload: "/create_ticket"
        - title: "Search knowledge base"
          payload: "/ask_knowledge"
        - title: "Help"
          payload: "/help"

  utter_handoff_queue_full:
    - text: "The support queue is currently full. Please try creating a ticket and an agent will follow up."
      buttons:
        - title: "Create a ticket"
          payload: "/accept_ticket_fallback"


actions:
  - action_embedding_fallback
  # ── Handoff actions ──────────────────────────────────────────────────
  - action_track_confidence
  - action_request_handoff
  - action_gdpr_consent
  - action_confirm_gdpr_consent
  - action_deny_gdpr_consent
  - action_confirm_handoff
  - action_cancel_handoff
  - action_resume_from_handoff
  # ── Existing actions ─────────────────────────────────────────────────
  - action_itsm_login
  - action_init_itsm_session
  - action_create_itsm_ticket
  - action_check_itsm_status
  - action_update_itsm_ticket
  - action_verify_itsm_resolution
  - action_deactivate_form
  - action_view_ticket_comments
  - action_list_open_tickets
  - action_upload_file
  - action_list_attachments
  - action_clear_session
  - action_extract_context
  - action_greet
  - action_show_chart
  - action_search_knowledge_base
  - action_save_feedback
  - action_handle_multi_intent
  - action_search_kb_before_ticket
  - action_create_ticket_from_form
  - action_save_satisfaction_rating
  - action_show_ticket_graph
  - action_show_kb_full_answer
  - action_show_kb_full_article

forms:
  ticket_form:
    required_slots:
      - ticket_title
      - ticket_content
      - issue_type
      - urgency

  login_form:
    required_slots:
        - itsm_username
        - itsm_password

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true