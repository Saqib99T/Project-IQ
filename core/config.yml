# config.yml # modified

recipe: default.v1
language: en
assistant_id: "itsm_support_assistant" 

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: RegexEntityExtractor
  - name: LexicalSyntacticFeaturizer
  # Word-level bag-of-words — generalises across paraphrases (was missing;
  # only char n-grams were present, limiting DIET to sub-word signal).
  - name: CountVectorsFeaturizer
  # Char n-grams — robust to typos / morphology (kept).
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier
    epochs: 100               # was 20 — default is 100; 20 badly under-trained
    constrain_similarities: true
  - name: EntitySynonymMapper
  - name: ResponseSelector     # handles all retrieval intents (faq/*, chitchat/*)
    epochs: 100               # was 20
    constrain_similarities: true
  - name: FallbackClassifier
    threshold: 0.5            # was 0.15 — too low; bot never admitted uncertainty
    ambiguity_threshold: 0.1  # → routes uncertain input to action_embedding_fallback

policies:
  - name: MemoizationPolicy
    max_history: 5
  - name: TEDPolicy
    max_history: 5
    epochs: 20
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 20
  - name: RulePolicy
    core_fallback_threshold: 0.2
    core_fallback_action_name: "action_default_fallback"
    enable_fallback_prediction: True
    restrict_rules: False
    check_for_contradictions: False
